name: Daily Rental Status Check

on:
  schedule:
    # Runs every day at 00:15 Asia/Kathmandu
    - cron: '15 18 * * *'
  workflow_dispatch:

jobs:
  rentalStatus:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [js, python]  # choose which script to run
    steps:
      - uses: actions/checkout@v3

      # Node.js setup
      - name: Set up Node.js
        if: matrix.script == 'js'
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Python setup
      - name: Set up Python
        if: matrix.script == 'python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install JS dependencies
        if: matrix.script == 'js'
        run: npm install

      - name: Install Python dependencies
        if: matrix.script == 'python'
        run: pip install firebase-admin

      # Write Firebase service account key
      - name: Write Firebase service account key
        run: |
          # Try secret first, fallback to environment variable
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > serviceAccountKey.json
          elif [ -n "${{ vars.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "${{ vars.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > serviceAccountKey.json
          else
            echo "ERROR: No Firebase service account provided!"
            exit 1
          fi

      # Run JS script
      - name: Run JS script
        if: matrix.script == 'js'
        run: node scripts/checkRentalStatus.js

      # Run Python script
      - name: Run Python script
        if: matrix.script == 'python'
        run: python scripts/checkRentalStatus.py
        env:
          # Prefer secret, fallback to variable
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || vars.FIREBASE_SERVICE_ACCOUNT }}
