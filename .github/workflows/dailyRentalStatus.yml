name: Daily Rental Status Check

on:
  schedule:
    # Runs every day at 00:15 Asia/Kathmandu
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      script:
        description: 'Which script to run?'
        required: true
        default: 'python'
        type: choice
        options:
          - js
          - python

jobs:
  rentalStatus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Decode Firebase service account
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}" | base64 --decode > serviceAccountKey.json

      - name: Set up Node.js
        if: ${{ github.event.inputs.script == 'js' }}
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        if: ${{ github.event.inputs.script == 'js' }}
        run: npm install

      - name: Run Node.js Rental Script
        if: ${{ github.event.inputs.script == 'js' }}
        run: node scripts/checkRentalStatus.js

      - name: Set up Python
        if: ${{ github.event.inputs.script == 'python' }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: ${{ github.event.inputs.script == 'python' }}
        run: pip install firebase-admin

      - name: Run Python Rental Script
        if: ${{ github.event.inputs.script == 'python' }}
        run: python scripts/checkRentalStatus.py
