name: Daily Rental Status Check

on:
  schedule:
    # Runs every day at 00:15 Asia/Kathmandu
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      script:
        description: "Choose script to run (default = python)"
        required: false
        default: "python"
        type: choice
        options:
          - js
          - python

jobs:
  rentalStatus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # --------------------------
      # Detect script to run
      # --------------------------
      - name: Set SCRIPT variable
        id: select-script
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "SCRIPT=python" >> $GITHUB_ENV
          else
            echo "SCRIPT=${{ github.event.inputs.script }}" >> $GITHUB_ENV
          fi

      # --------------------------
      # Node.js setup
      # --------------------------
      - name: Set up Node.js
        if: env.SCRIPT == 'js'
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # --------------------------
      # Python setup
      # --------------------------
      - name: Set up Python
        if: env.SCRIPT == 'python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # --------------------------
      # Install dependencies
      # --------------------------
      - name: Install JS dependencies
        if: env.SCRIPT == 'js'
        run: npm install

      - name: Install Python dependencies
        if: env.SCRIPT == 'python'
        run: pip install firebase-admin

      # --------------------------
      # Write Firebase service account key
      # --------------------------
      - name: Write Firebase service account key
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > serviceAccountKey.json
          elif [ -n "${{ vars.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "${{ vars.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > serviceAccountKey.json
          else
            echo "ERROR: No Firebase service account provided!"
            exit 1
          fi

      # --------------------------
      # Run scripts
      # --------------------------
      - name: Run JS script
        if: env.SCRIPT == 'js'
        run: node scripts/checkRentalStatus.js

      - name: Run Python script
        if: env.SCRIPT == 'python'
        run: python scripts/checkRentalStatus.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || vars.FIREBASE_SERVICE_ACCOUNT }}
