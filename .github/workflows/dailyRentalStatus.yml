name: Daily Rental Status Check

on:
  schedule:
    # Runs every day at 00:15 Asia/Kathmandu
    - cron: '15 18 * * *'
  workflow_dispatch:

jobs:
  rentalStatus:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [js, python]  # switch between js or python
    steps:
      - uses: actions/checkout@v3

      # Node.js setup (needed if JS is run)
      - name: Set up Node.js
        if: matrix.script == 'js'
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Python setup (needed if Python is run)
      - name: Set up Python
        if: matrix.script == 'python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Install JS dependencies
      - name: Install JS dependencies
        if: matrix.script == 'js'
        run: npm install

      # Install Python dependencies
      - name: Install Python dependencies
        if: matrix.script == 'python'
        run: pip install firebase-admin

      # Write Firebase service account key file
      - name: Write Firebase service account key
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Run JS script
      - name: Run Rental Status JS Script
        if: matrix.script == 'js'
        run: node scripts/checkRentalStatus.js

      # Run Python script
      - name: Run Rental Status Python Script
        if: matrix.script == 'python'
        run: python scripts/checkRentalStatus.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
